dividend_plan:
  default_capital_krw: 10000000     # 기본 투자금(앱에서 변경 가능)
  max_picks: 6                       # 플랜에 담을 종목 수
  covered_call_max_weight: 0.20      # 커버드콜 ETF 합산 최대 비중
  max_yield_cap: 0.09                # 이보다 높은 배당률은 지속가능성 의심 → 점수 상한
  tax:
    us: 0.15                         # 미국 배당 원천징수
    kr: 0.154                        # 국내 배당소득세

# 4) 차트 분석 설정
technical:
  ma: [20, 50, 120, 250]     # 이동평균(단기·중기·중장기·장기). 국내식 240일을 원하면 250 → 240
  rsi: 14
  macd: [12, 26, 9]
  bb: [20, 2.0]              # 볼린저 기간·표준편차 배수
  chart_days: 130            # 앱 상세 차트에 표시할 봉 수(약 6개월)

# 4-1) 백테스트·자가 보정
backtest:
  period: 10y                # 백테스트 기간 (5y / 10y). 길수록 다양한 장세 포함, 실행 시간 증가

# 5) 알림 규칙
alerts:
  daily_move_pct: 5.0        # 일간 ±5% 이상 변동
  rsi_low: 30                # RSI 과매도
  rsi_high: 70               # RSI 과매수
  ma_cross: true             # 20·50 / 50·120 / 50·250 골든·데드크로스, 250일선 돌파·이탈 (당일 발생분)
  chart_signals: true        # RSI 30 상향돌파·볼린저 하단 재진입·52주 신고가·RSI 다이버전스·셋업(눌림목/반등/돌파)
  verdict_change: true       # 5단계 판정 변경
  target_reach: true         # 애널리스트 평균 목표가 도달
  custom_price:              # 개별 가격 알림 (above / below)
    - { ticker: 000660.KS, below: 1500000 }
    - { ticker: NVDA, above: 250 }

# 6) 장전 브리핑 지표
briefing:
